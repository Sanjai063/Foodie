<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <!-- Sidebar profile info card -->
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white mb-4">
            <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
              <i class="bi bi-person"></i>
            </div>
            <h4 class="fw-bold mb-1" id="displayUserName">User Name</h4>
            <p class="text-muted small mb-2" id="displayUserEmail">user@example.com</p>
            <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3 py-1 text-uppercase mb-3" id="displayUserRole">Customer</span>

            <hr class="my-3">

            <div class="row text-center">
              <div class="col-6 border-end">
                <h4 class="fw-bold text-primary mb-0" id="userOrderCount">0</h4>
                <small class="text-muted">Total Orders</small>
              </div>
              <div class="col-6">
                <h4 class="fw-bold text-success mb-0">Active</h4>
                <small class="text-muted">Account Status</small>
              </div>
            </div>

            <div class="mt-4 pt-2">
              <a href="orders.html" class="btn btn-outline-primary btn-pill w-100 mb-2">
                <i class="bi bi-bag-check me-2"></i>My Orders
              </a>
              <button class="btn btn-light text-danger btn-pill w-100" onclick="Auth.logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </button>
            </div>
          </div>
        </div>

        <!-- Forms Column -->
        <div class="col-lg-8">
          <!-- Update Profile Details -->
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mb-4">
            <h4 class="fw-bold mb-4"><i class="bi bi-gear-wide-connected me-2 text-primary"></i>Profile Details</h4>
            
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="profileName" class="form-label small fw-semibold">Full Name</label>
                  <input type="text" class="form-control" id="profileName" required>
                </div>
                <div class="col-md-6">
                  <label for="profileEmail" class="form-label small fw-semibold">Email Address (Read-only)</label>
                  <input type="email" class="form-control bg-light" id="profileEmail" readonly>
                </div>
                <div class="col-md-6">
                  <label for="profilePhone" class="form-label small fw-semibold">Phone Number</label>
                  <input type="tel" class="form-control" id="profilePhone" pattern="[0-9]{10}" required>
                </div>
                <div class="col-md-6">
                  <label for="profileCity" class="form-label small fw-semibold">City</label>
                  <input type="text" class="form-control" id="profileCity">
                </div>
                <div class="col-md-8">
                  <label for="profileStreet" class="form-label small fw-semibold">Street Address / Flat No.</label>
                  <input type="text" class="form-control" id="profileStreet">
                </div>
                <div class="col-md-4">
                  <label for="profilePincode" class="form-label small fw-semibold">Pincode</label>
                  <input type="text" class="form-control" id="profilePincode">
                </div>
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary btn-pill px-4">
                    Save Changes
                  </button>
                </div>
              </div>
            </form>
          </div>

          <!-- Change Password -->
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h4 class="fw-bold mb-4"><i class="bi bi-shield-lock me-2 text-primary"></i>Change Password</h4>

            <form id="passwordForm">
              <div class="row g-3">
                <div class="col-12">
                  <label for="currentPassword" class="form-label small fw-semibold">Current Password</label>
                  <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="col-md-6">
                  <label for="newPassword" class="form-label small fw-semibold">New Password</label>
                  <input type="password" class="form-control" id="newPassword" minlength="6" required>
                </div>
                <div class="col-md-6">
                  <label for="confirmNewPassword" class="form-label small fw-semibold">Confirm New Password</label>
                  <input type="password" class="form-control" id="confirmNewPassword" required>
                </div>
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-outline-primary btn-pill px-4">
                    Update Password
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar('profile');
    renderFooter();
  </script>
</body>
</html>
