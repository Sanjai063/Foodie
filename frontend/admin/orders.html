<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders | FoodieBites Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 col-md-3 p-0">
        <div class="admin-sidebar" id="adminSidebar"></div>
      </div>

      <div class="col-lg-10 col-md-9 p-4 p-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom gap-3">
          <div>
            <h3 class="fw-bold mb-1">Orders Management</h3>
            <p class="text-muted mb-0">Track, update live fulfillment statuses, and inspect invoices</p>
          </div>

          <!-- Filter by status -->
          <div class="d-flex align-items-center gap-2">
            <label for="orderStatusFilter" class="small fw-semibold text-muted text-nowrap mb-0">Filter Status:</label>
            <select id="orderStatusFilter" class="form-select form-select-sm rounded-pill" style="min-width: 170px;">
              <option value="all" selected>All Statuses</option>
              <option value="Order Placed">Order Placed</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Preparing">Preparing</option>
              <option value="Out for Delivery">Out for Delivery</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="table-responsive">
            <table class="table align-middle table-hover">
              <thead class="table-light">
                <tr>
                  <th>Order ID</th>
                  <th>Customer Info</th>
                  <th>Order Time</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Change Status</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="adminOrdersTableBody">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initOrdersManagement);
  </script>
</body>
</html>
