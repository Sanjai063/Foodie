<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Foods | FoodieBites Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row">
      <!-- Admin Sidebar -->
      <div class="col-lg-2 col-md-3 p-0">
        <div class="admin-sidebar" id="adminSidebar"></div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-10 col-md-9 p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
          <div>
            <h3 class="fw-bold mb-1">Food Items Inventory</h3>
            <p class="text-muted mb-0">Add new delicacies, modify pricing, manage dietary tags, and toggle stock</p>
          </div>
          <button class="btn btn-primary btn-pill" data-bs-toggle="modal" data-bs-target="#addFoodModal">
            <i class="bi bi-plus-lg me-1"></i> Add New Food
          </button>
        </div>

        <!-- Foods Table Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="table-responsive">
            <table class="table align-middle table-hover">
              <thead class="table-light">
                <tr>
                  <th>Image</th>
                  <th>Dish Name & Meta</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Rating</th>
                  <th>In Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="foodsTableBody">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Food Modal -->
  <div class="modal fade" id="addFoodModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Add New Food Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addFoodForm">
          <div class="modal-body p-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="foodName" class="form-label small fw-semibold">Dish Name *</label>
                <input type="text" class="form-control" id="foodName" placeholder="e.g. Classic Margherita Pizza" required>
              </div>

              <div class="col-md-6">
                <label for="foodCategory" class="form-label small fw-semibold">Category *</label>
                <select class="form-select" id="foodCategory" required>
                  <!-- Populated by admin.js -->
                </select>
              </div>

              <div class="col-md-4">
                <label for="foodPrice" class="form-label small fw-semibold">Price (₹) *</label>
                <input type="number" class="form-control" id="foodPrice" placeholder="299" min="0" step="1" required>
              </div>

              <div class="col-md-4">
                <label for="foodIsVeg" class="form-label small fw-semibold">Dietary Type *</label>
                <select class="form-select" id="foodIsVeg" required>
                  <option value="true" selected>Pure Veg</option>
                  <option value="false">Non-Vegetarian</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="foodSpiceLevel" class="form-label small fw-semibold">Spice Level</label>
                <select class="form-select" id="foodSpiceLevel">
                  <option value="Mild">Mild</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="Spicy">Spicy</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="foodPrepTime" class="form-label small fw-semibold">Prep Time</label>
                <input type="text" class="form-control" id="foodPrepTime" placeholder="20 mins" value="20 mins">
              </div>

              <div class="col-md-4">
                <label for="foodCalories" class="form-label small fw-semibold">Calories (kcal)</label>
                <input type="number" class="form-control" id="foodCalories" placeholder="350" value="350">
              </div>

              <div class="col-md-4">
                <label for="foodImage" class="form-label small fw-semibold">Image URL *</label>
                <input type="url" class="form-control" id="foodImage" placeholder="https://images.unsplash.com/..." required>
              </div>

              <div class="col-12">
                <label for="foodIngredients" class="form-label small fw-semibold">Ingredients (Comma Separated)</label>
                <input type="text" class="form-control" id="foodIngredients" placeholder="Mozzarella Cheese, Fresh Basil, Olive Oil">
              </div>

              <div class="col-12">
                <label for="foodDescription" class="form-label small fw-semibold">Description *</label>
                <textarea class="form-control" id="foodDescription" rows="3" placeholder="Describe the flavors, texture, preparation..." required></textarea>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="foodAvailable" checked>
                  <label class="form-check-label fw-semibold small" for="foodAvailable">Available for Ordering Immediately</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light btn-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-pill btn-sm px-4">Save Food Item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Food Modal -->
  <div class="modal fade" id="editFoodModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Edit Food Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editFoodForm">
          <input type="hidden" id="editFoodId">
          <div class="modal-body p-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="editFoodName" class="form-label small fw-semibold">Dish Name *</label>
                <input type="text" class="form-control" id="editFoodName" required>
              </div>

              <div class="col-md-6">
                <label for="editFoodCategory" class="form-label small fw-semibold">Category *</label>
                <select class="form-select" id="editFoodCategory" required>
                  <!-- Populated by admin.js -->
                </select>
              </div>

              <div class="col-md-4">
                <label for="editFoodPrice" class="form-label small fw-semibold">Price (₹) *</label>
                <input type="number" class="form-control" id="editFoodPrice" min="0" step="1" required>
              </div>

              <div class="col-md-4">
                <label for="editFoodIsVeg" class="form-label small fw-semibold">Dietary Type *</label>
                <select class="form-select" id="editFoodIsVeg" required>
                  <option value="true">Pure Veg</option>
                  <option value="false">Non-Vegetarian</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="editFoodSpiceLevel" class="form-label small fw-semibold">Spice Level</label>
                <select class="form-select" id="editFoodSpiceLevel">
                  <option value="Mild">Mild</option>
                  <option value="Medium">Medium</option>
                  <option value="Spicy">Spicy</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="editFoodPrepTime" class="form-label small fw-semibold">Prep Time</label>
                <input type="text" class="form-control" id="editFoodPrepTime">
              </div>

              <div class="col-md-4">
                <label for="editFoodCalories" class="form-label small fw-semibold">Calories (kcal)</label>
                <input type="number" class="form-control" id="editFoodCalories">
              </div>

              <div class="col-md-4">
                <label for="editFoodImage" class="form-label small fw-semibold">Image URL *</label>
                <input type="url" class="form-control" id="editFoodImage" required>
              </div>

              <div class="col-12">
                <label for="editFoodIngredients" class="form-label small fw-semibold">Ingredients (Comma Separated)</label>
                <input type="text" class="form-control" id="editFoodIngredients">
              </div>

              <div class="col-12">
                <label for="editFoodDescription" class="form-label small fw-semibold">Description *</label>
                <textarea class="form-control" id="editFoodDescription" rows="3" required></textarea>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="editFoodAvailable">
                  <label class="form-check-label fw-semibold small" for="editFoodAvailable">Available for Ordering</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light btn-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-pill btn-sm px-4">Update Food</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initFoodsManagement);
  </script>
</body>
</html>
