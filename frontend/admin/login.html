<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-3 mb-2 fs-2">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Admin Portal</h3>
            <p class="text-muted small">FoodieBites System Management</p>
          </div>

          <div id="adminErrorAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

          <form id="adminLoginForm">
            <div class="mb-3">
              <label for="adminEmail" class="form-label small fw-semibold">Admin Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="adminEmail" placeholder="admin@foodie.com" value="admin@foodie.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="adminPassword" class="form-label small fw-semibold">Admin Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control" id="adminPassword" placeholder="••••••••" value="admin123" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-pill py-2 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Enter Dashboard
            </button>
          </form>

          <div class="text-center mt-3 pt-3 border-top">
            <a href="../index.html" class="text-muted small text-decoration-none">
              &larr; Return to Customer Website
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errorAlert = document.getElementById('adminErrorAlert');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';
        if (errorAlert) errorAlert.classList.add('d-none');

        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          if (data.user.role !== 'admin') {
            errorAlert.textContent = 'Access Denied: This account does not have administrator privileges.';
            errorAlert.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Enter Dashboard';
            return;
          }

          Auth.setUser(data.user, data.token);
          showToast('Admin authorized! Loading dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          errorAlert.textContent = data.message || 'Invalid administrator credentials';
          errorAlert.classList.remove('d-none');
        }
      } catch (err) {
        errorAlert.textContent = 'Server connection error. Please verify backend is running.';
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Enter Dashboard';
      }
    });
  </script>
</body>
</html>
