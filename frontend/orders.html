<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">My Orders</h2>
          <p class="text-muted mb-0">Track live orders and view your previous food history</p>
        </div>
        <a href="menu.html" class="btn btn-primary btn-pill btn-sm">
          <i class="bi bi-plus-lg me-1"></i> New Order
        </a>
      </div>

      <!-- Empty State -->
      <div id="emptyOrdersState" class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white d-none">
        <div class="py-5">
          <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-4 mb-3 fs-1">
            <i class="bi bi-bag-x"></i>
          </div>
          <h3 class="fw-bold">No Orders Placed Yet</h3>
          <p class="text-muted mx-auto mb-4" style="max-width: 400px;">
            You haven't ordered any delicious food with us yet. Head over to our menu and treat yourself!
          </p>
          <a href="menu.html" class="btn btn-primary btn-pill px-4">Browse Menu</a>
        </div>
      </div>

      <!-- Orders List Container -->
      <div id="ordersListContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading orders...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
