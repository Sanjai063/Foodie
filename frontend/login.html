<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card-custom rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-3 mb-2 fs-3">
                <i class="bi bi-box-arrow-in-right"></i>
              </div>
              <h3 class="fw-bold">Welcome Back</h3>
              <p class="text-muted small">Sign in to your FoodieBites account</p>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                  <button class="btn btn-light border border-start-0" type="button" onclick="togglePasswordVisibility('password', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 btn-pill py-2 mb-3">
                Log In
              </button>
            </form>

            <!-- Quick Demo Credentials Box for College Viva -->
            <div class="p-3 rounded-4 mt-3 mb-3" style="background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);">
              <h6 class="fw-bold mb-2 small text-muted"><i class="bi bi-info-circle me-1"></i> Quick Demo Logins (Click to Fill):</h6>
              <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillCredentials('john@example.com', 'user123')">
                  Customer (John)
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillCredentials('priya@example.com', 'user123')">
                  Customer (Priya)
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill" onclick="fillCredentials('admin@foodie.com', 'admin123')">
                  Admin User
                </button>
              </div>
            </div>

            <div class="text-center">
              <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-semibold">Sign Up</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar('login');
    renderFooter();

    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
