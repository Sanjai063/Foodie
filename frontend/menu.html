<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <!-- Title & Search Header -->
      <div class="row align-items-center mb-4 g-3">
        <div class="col-md-6">
          <h2 class="fw-bold mb-1">Our Culinary Menu</h2>
          <p class="text-muted mb-0">Browse through our multi-cuisine specialties, hand-crafted fresh to order</p>
        </div>
        <div class="col-md-6">
          <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" id="searchInput" class="form-control border-start-0 py-2 rounded-end-pill" placeholder="Search by dish name, keyword, ingredients...">
          </div>
        </div>
      </div>

      <!-- Category Filter Pills & Feature Toggles Bar -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <!-- Category Pills Scrollable -->
        <div class="d-flex flex-wrap gap-2 align-items-center flex-grow-1" id="categoryPillsContainer">
          <div class="spinner-border spinner-border-sm text-primary" role="status">
            <span class="visually-hidden">Loading categories...</span>
          </div>
        </div>

        <!-- Quick Toggles: Pure Veg & Favorites -->
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="veg-filter-btn" id="vegToggleBtn" title="Show only Vegetarian food">
            <span class="diet-icon-veg" style="width:12px;height:12px;"></span> Pure Veg
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm btn-pill" id="favsFilterBtn" title="Show your saved favorite dishes">
            <i class="bi bi-heart me-1"></i> My Favorites
          </button>
        </div>
      </div>

      <!-- Controls & Filter Toolbar -->
      <div class="card-custom rounded-4 p-3 mb-4">
        <div class="row align-items-center g-3">
          <!-- Item count badge -->
          <div class="col-sm-6 col-md-3">
            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-semibold" id="itemCountBadge">
              Loading dishes...
            </span>
          </div>

          <!-- Price filter slider -->
          <div class="col-sm-6 col-md-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="priceRange" class="form-label small fw-semibold mb-0">Max Price:</label>
              <span class="fw-bold text-primary small" id="priceDisplay">₹600</span>
            </div>
            <input type="range" class="form-range" id="priceRange" min="80" max="600" step="20" value="600">
          </div>

          <!-- Sort dropdown -->
          <div class="col-sm-8 col-md-3">
            <div class="d-flex align-items-center gap-2">
              <label for="sortSelect" class="small fw-semibold text-muted text-nowrap mb-0">Sort By:</label>
              <select id="sortSelect" class="form-select form-select-sm rounded-pill">
                <option value="rating" selected>Top Rated</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="name">Name (A - Z)</option>
              </select>
            </div>
          </div>

          <!-- Reset button -->
          <div class="col-sm-4 col-md-2 text-md-end">
            <button class="btn btn-outline-secondary btn-sm btn-pill w-100" id="clearFiltersBtn">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
            </button>
          </div>
        </div>
      </div>

      <!-- Food Items Grid -->
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="foodGridContainer">
        <!-- Dynamically injected foods -->
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
