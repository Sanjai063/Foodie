<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | FoodieBites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card-custom rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-3 mb-2 fs-3">
                <i class="bi bi-person-plus"></i>
              </div>
              <h3 class="fw-bold">Create Account</h3>
              <p class="text-muted small">Join FoodieBites today & enjoy delicious hot meals</p>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert"></div>

            <form id="registerForm">
              <div class="row g-3">
                <div class="col-12">
                  <label for="name" class="form-label small fw-semibold">Full Name *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="name" placeholder="John Doe" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label small fw-semibold">Email Address *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="john@example.com" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="phone" class="form-label small fw-semibold">Phone Number *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                    <input type="tel" class="form-control border-start-0" id="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
                  </div>
                  <div class="form-text text-muted" style="font-size: 0.75rem;">10-digit mobile number</div>
                </div>

                <div class="col-md-6">
                  <label for="password" class="form-label small fw-semibold">Password *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="Min 6 characters" minlength="6" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="confirmPassword" placeholder="Re-type password" required>
                  </div>
                </div>

                <!-- Optional Delivery Address fields -->
                <div class="col-12 mt-3">
                  <h6 class="fw-bold small text-muted border-bottom pb-2">Default Delivery Address (Optional)</h6>
                </div>

                <div class="col-12">
                  <label for="street" class="form-label small fw-semibold">Street Address / Flat No.</label>
                  <input type="text" class="form-control" id="street" placeholder="e.g. 42 Maple Street, Green Glen">
                </div>

                <div class="col-md-6">
                  <label for="city" class="form-label small fw-semibold">City</label>
                  <input type="text" class="form-control" id="city" placeholder="Bengaluru">
                </div>

                <div class="col-md-6">
                  <label for="pincode" class="form-label small fw-semibold">Pincode</label>
                  <input type="text" class="form-control" id="pincode" placeholder="560103">
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary w-100 btn-pill py-2">
                    Sign Up
                  </button>
                </div>
              </div>
            </form>

            <div class="text-center mt-4">
              <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-semibold">Log In</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    renderNavbar('register');
    renderFooter();
  </script>
</body>
</html>
